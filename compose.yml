services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
    deploy:
      resources:
        limits:
          memory: 5g
    stdin_open: true
    tty: true
    environment:
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
      - COREPACK_HOME=/workspace/.corepack
      - HOME=/workspace/.home
      - CARGO_HOME=/workspace/.cargo
      - PATH=/opt/rust/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

  # Standalone demo: builds a clean image that pulls async_jsonata_rust from
  # crates.io (not this repo) and runs the orders_report example.
  #   docker compose run --rm examples-app
  examples-app:
    build:
      context: ./examples-app
      dockerfile: Dockerfile
