name: jsonata-rust-ci

on:
  push:
    paths:
      - "src/jsonata-rust/**"
      - ".github/workflows/jsonata-rust-ci.yml"
  pull_request:
    paths:
      - "src/jsonata-rust/**"
      - ".github/workflows/jsonata-rust-ci.yml"

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        working-directory: src/jsonata-rust

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-targets --all-features -- --nocapture

      - name: cargo test --doc
        run: cargo test --doc --all-features

      - name: cargo test --examples
        run: cargo test --examples --all-features
