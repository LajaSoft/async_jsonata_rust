[package]
name = "async_jsonata_rust"
version = "0.4.1"
edition = "2021"
rust-version = "1.78"
description = "Async-first JSONata parser/runtime crate with stable Rust API facade"
readme = "README.md"
license = "MIT"
documentation = "https://github.com/LajaSoft/async_jsonata_rust/tree/master/src/jsonata-rust"
homepage = "https://docs.jsonata.org/"
repository = "https://github.com/LajaSoft/async_jsonata_rust/"
keywords = ["jsonata", "json", "query", "transform", "async"]
categories = ["parser-implementations", "asynchronous"]

[lib]
name = "async_jsonata_rust"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
rand = "0.9.3"
futures = "0.3"
ryu = "1.0"
base64 = "0.22"
percent-encoding = "2.3"
time = { version = "0.3", features = ["std"] }
regex = "1.11"
stacker = "0.1"

[dev-dependencies]
# Custom test harness for the data-driven official suite, so each group is a
# named test the framework prints as it runs (instead of one opaque #[test]).
libtest-mimic = "0.8"
# `thread-pool` gives tests a real work-stealing multi-thread executor, needed to
# exercise a single evaluation future migrating across threads (see
# `tests/recursion_budget.rs`).
futures = { version = "0.3", features = ["thread-pool"] }

[[test]]
name = "official_suite"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
