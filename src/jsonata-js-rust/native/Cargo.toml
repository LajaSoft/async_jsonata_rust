[package]
name = "jsonata_js_bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
jsonata_rust = { path = "../../jsonata-rust" }
napi = { version = "2", default-features = false, features = ["napi6", "serde-json", "tokio_rt"] }
napi-derive = "2"
serde_json = "1.0"
futures = "0.3"

[build-dependencies]
napi-build = "2"
